[tool.poetry]
name = "stt-tg-bot"
version = "0.1.0"
description = "Speech-to-text and text-to-speech Telegram bot."
authors = ["STT Bot Team <dev@example.com>"]
readme = "README.md"
packages = [{ include = "stt_tg_bot" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
aiogram = ">=3.13.1,<4.0.0"
groq = ">=0.11.0,<1.0.0"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = ">=0.31.0,<1.0.0"
python-multipart = ">=0.0.9,<1.0.0"
aiofiles = ">=24.1.0,<25.0.0"
pydantic-settings = ">=2.6.0,<3.0.0"
httpx = ">=0.27.0,<1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.8"
ruff = "^0.6.9"
mypy = "^1.11.2"
bandit = "^1.7.10"
pip-audit = "^2.7.3"
pre-commit = "^3.8.0"
types-aiofiles = "^24.1.0.20240626"
